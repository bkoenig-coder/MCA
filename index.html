<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- First visit: paint the carpet's blue at once, so slow phones do not show a white screen while the site loads.
         CarpetIntro takes the class off again. The conditions match the ones in CarpetIntro.tsx. -->
    <script>
      try {
        var n = navigator, c = n.connection || {};
        if (!sessionStorage.getItem('mca-intro-seen') &&
            !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) &&
            !(n.deviceMemory && n.deviceMemory <= 2) && !c.saveData && !/(^|-)2g$/.test(c.effectiveType || '')) {
          document.documentElement.className += ' intro-pending';
        }
      } catch (e) {}
    </script>
    <style>html.intro-pending, html.intro-pending body { background: #0A2A5C; }</style>

    <!-- Google Analytics is loaded from src/lib/consent.ts, only after the visitor accepts analytics cookies -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Primary Meta Tags -->
    <title>Mongolian Center Austria | Cultural &amp; Business Center in Vienna</title>
    <meta name="title" content="Mongolian Center Austria | Cultural &amp; Business Center in Vienna" />
    <meta name="description" content="The cooperation center of Mongolian citizens in Austria. Join cultural events, language courses, traditional arts and Austrian–Mongolian cultural exchange through our center." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mongoliancenter.org/" />
    <meta property="og:title" content="Mongolian Center Austria | Cultural &amp; Business Center in Vienna" />
    <meta property="og:description" content="The cooperation center of Mongolian citizens in Austria. Join cultural events, language courses, traditional arts and Austrian–Mongolian cultural exchange through our center." />
    <meta property="og:image" content="https://mongoliancenter.org/og-image.png?v=3" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Mongolian Center Austria (Mongolische Zentrum in Österreich) logo" />
    <meta property="og:site_name" content="Mongolian Center Austria" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_AT" />
    <meta property="og:locale:alternate" content="mn_MN" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mongoliancenter.org/" />
    <meta name="twitter:title" content="Mongolian Center Austria | Cultural &amp; Business Center in Vienna" />
    <meta name="twitter:description" content="The cooperation center of Mongolian citizens in Austria. Join cultural events, language courses, traditional arts and Austrian–Mongolian cultural exchange through our center." />
    <meta name="twitter:image" content="https://mongoliancenter.org/og-image.png?v=3" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
